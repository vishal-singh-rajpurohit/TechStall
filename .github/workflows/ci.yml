name: CI/CD Pipeline - Semantic E-Commerce

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Quality Gate: Linting, Type Checking & Configuration Validation
  # ============================================================================
  lint-and-validate:
    name: Lint & Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            Frontend/package-lock.json
            Seller_dahsboard/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend/requirements.txt

      - name: Validate Docker Compose Configurations
        run: |
          echo "Validating docker-compose.yml..."
          docker compose config -q
          echo "Validating docker-compose.prod.yml..."
          docker compose -f docker-compose.prod.yml config -q
          echo "Validating docker-compose.dev.yml..."
          docker compose -f docker-compose.dev.yml config -q

      - name: Validate Nginx Configuration Syntax
        run: |
          echo "Testing Nginx syntax using official nginx:alpine image..."
          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host seller_dashboard:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            -v "${{ github.workspace }}/nginx/default-http.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Lint Frontend (Storefront)
        run: |
          cd Frontend
          npm ci
          npm run lint

      - name: Lint Seller Dashboard
        run: |
          cd Seller_dahsboard
          npm ci
          npm run lint

      - name: Validate Backend Python Syntax
        run: |
          cd Backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall src/

  # ============================================================================
  # 2. Build Gate: Multi-Stage Docker Image Compilation
  # ============================================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: semantic-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: false
          tags: semantic-frontend:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_API_URL=https://seller.vishalsingh.me/api
            NEXT_PUBLIC_API_URL=https://seller.vishalsingh.me/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build Seller Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: ./Seller_dahsboard
          file: ./Seller_dahsboard/Dockerfile
          push: false
          tags: semantic-seller-dashboard:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://seller.vishalsingh.me/api/v1
            NEXT_PUBLIC_STOREFRONT_URL=https://seller.vishalsingh.me
          cache-from: type=gha,scope=seller
          cache-to: type=gha,mode=max,scope=seller

  # ============================================================================
  # 3. Continuous Deployment (CD): Deploy to AWS EC2 Ubuntu Host
  # ============================================================================
  deploy-aws:
    name: Deploy to AWS EC2 Ubuntu
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=== Starting Production Deployment on AWS EC2 ==="

            # 1. Navigate to deployment directory
            PROJECT_DIR="${{ secrets.EC2_PROJECT_PATH || '/home/ubuntu/semantic-ecommerce' }}"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory $PROJECT_DIR not found. Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"

            # 2. Pull latest release from main branch
            echo "Pulling latest changes from main branch..."
            git fetch --all
            git reset --hard origin/main

            # 3. Inject production environment variables if secret provided
            if [ -n "${{ secrets.PROD_ENV_FILE }}" ]; then
              echo "Writing production .env.docker.prod from GitHub Secrets..."
              echo "${{ secrets.PROD_ENV_FILE }}" > .env.docker.prod
            fi

            # 4. Pull and build containers with Docker Compose
            echo "Building and starting containerized stack..."
            docker compose -f docker-compose.prod.yml --env-file .env.docker.prod up -d --build

            # 5. Clean up dangling images to conserve disk space
            echo "Pruning unused Docker images..."
            docker image prune -f

            # 6. Verify service health
            echo "Verifying running container statuses..."
            sleep 8
            docker compose -f docker-compose.prod.yml ps

            echo "=== Deployment Completed Successfully! ==="
