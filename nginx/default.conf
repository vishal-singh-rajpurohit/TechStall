# ==========================================
# Production Nginx Reverse Proxy Configuration
# Domain: seller.vishalsingh.me
# ==========================================

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream definitions using Docker Compose internal network DNS
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream seller_upstream {
    server seller_dashboard:3001;
    keepalive 32;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# ------------------------------------------
# HTTP Server (Port 80)
# Handles ACME challenge and redirects to HTTPS
# ------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name seller.vishalsingh.me;

    # Let's Encrypt / Certbot ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------
# HTTPS Server (Port 443)
# Reverse proxy for Frontend, Admin Dashboard & API
# ------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seller.vishalsingh.me;

    # SSL / TLS Certificates
    ssl_certificate /etc/letsencrypt/live/seller.vishalsingh.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seller.vishalsingh.me/privkey.pem;

    # Modern TLS Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Global proxy header defaults
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # ------------------------------------------
    # 1. FastAPI Backend API Gateway (/api/)
    # ------------------------------------------
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://backend_upstream;

        # Keep original URL path intact (/api/v1/..., /api/docs, etc.)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running / AI embedding requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming responses
        proxy_buffering off;

        # Allow file uploads (product images, media)
        client_max_body_size 50M;
    }

    # ------------------------------------------
    # 2. Seller / Admin Dashboard (/admin/)
    # ------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    # Seller static assets caching
    location /admin/_next/static/ {
        proxy_pass http://seller_upstream;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /admin/ {
        proxy_pass http://seller_upstream;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }

    # ------------------------------------------
    # 3. Main Customer Storefront Frontend (/)
    # ------------------------------------------
    # Frontend static assets caching
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://frontend_upstream;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 25M;
    }
}
