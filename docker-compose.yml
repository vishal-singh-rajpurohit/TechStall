# ==========================================
# Production Docker Compose Stack (Unified)
# Domain: seller.vishalsingh.me
# ==========================================
# Optimized multi-stage builds, non-root users, standalone Next.js,
# Nginx TLS reverse proxy & Certbot SSL auto-renewal.
#
# Usage:
#   docker compose up -d --build
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres_vector:
    image: pgvector/pgvector:pg16
    container_name: semantic_pgvector_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-semantic_ecommerce}
    volumes:
      - pgvector_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-semantic_ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - semantic_net_prod

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: semantic_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres_vector:5432/${POSTGRES_DB:-semantic_ecommerce}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-base-en-v1.5}
      HF_TOKEN: ${HF_TOKEN:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    depends_on:
      postgres_vector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - semantic_net_prod

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-https://seller.vishalsingh.me/api}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://seller.vishalsingh.me/api/v1}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    container_name: semantic_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-https://seller.vishalsingh.me/api}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://seller.vishalsingh.me/api/v1}
      BACKEND_API_URL: http://backend:8000
      NEXTAUTH_URL: ${FRONTEND_NEXTAUTH_URL:-https://seller.vishalsingh.me}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-semantic-ecommerce-key-2026}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - semantic_net_prod

  seller_dashboard:
    build:
      context: ./Seller_dahsboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_SELLER_API_URL:-https://seller.vishalsingh.me/api/v1}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-https://seller.vishalsingh.me}
    container_name: semantic_seller_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_SELLER_API_URL:-https://seller.vishalsingh.me/api/v1}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-https://seller.vishalsingh.me}
      BACKEND_API_URL: http://backend:8000
      NEXTAUTH_URL: ${SELLER_NEXTAUTH_URL:-https://seller.vishalsingh.me/admin/api/auth}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-semantic-ecommerce-key-2026}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - semantic_net_prod

  nginx:
    image: nginx:alpine
    container_name: semantic_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - seller_dashboard
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - semantic_net_prod

  certbot:
    image: certbot/certbot
    container_name: semantic_certbot_prod
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - semantic_net_prod

volumes:
  pgvector_prod_data:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local
  certbot_www:
    driver: local

networks:
  semantic_net_prod:
    driver: bridge
